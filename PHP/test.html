<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✨ Космос в браузере</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: #05060f;
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* ── Аврора на фоне ─────────────────────────────── */
  .aurora {
    position: fixed;
    inset: -30%;
    z-index: 0;
    filter: blur(80px);
    opacity: .55;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: float 20s ease-in-out infinite;
  }
  .b1 { width: 45vmax; height: 45vmax; left:  5%; top:  10%;
        background: radial-gradient(circle, #4d5bff, transparent 70%); }
  .b2 { width: 40vmax; height: 40vmax; right: 0%; top:   0%;
        background: radial-gradient(circle, #ff3ea5, transparent 70%);
        animation-delay: -7s; }
  .b3 { width: 50vmax; height: 50vmax; left: 30%; bottom: -15%;
        background: radial-gradient(circle, #00e5c0, transparent 70%);
        animation-delay: -13s; }

  @keyframes float {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    33%      { transform: translate3d(6vw, -4vh, 0) scale(1.15); }
    66%      { transform: translate3d(-5vw, 5vh, 0) scale(.9); }
  }

  /* ── Холст ──────────────────────────────────────── */
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* ── Виньетка ───────────────────────────────────── */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
                transparent 45%, rgba(0, 0, 0, .55) 100%);
  }

  /* ── Стеклянная карточка ────────────────────────── */
  .card {
    position: fixed;
    z-index: 3;
    left: 50%;
    bottom: clamp(18px, 5vh, 48px);
    transform: translateX(-50%);
    padding: 18px 28px;
    border-radius: 18px;
    text-align: center;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .18);
    user-select: none;
    pointer-events: none;
    animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, 26px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  .card h1 {
    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 600;
    letter-spacing: .4px;
    background: linear-gradient(90deg, #7ee8ff, #b48cff, #ff7ac6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card p {
    margin-top: 7px;
    font-size: clamp(11px, 1.5vw, 13px);
    opacity: .72;
    line-height: 1.6;
  }
  kbd {
    font: inherit;
    font-size: .9em;
    padding: 1px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .18);
  }
  #mode { color: #9ff3ff; font-weight: 600; }
</style>
</head>
<body>

  <div class="aurora">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <canvas id="c"></canvas>
  <div class="vignette"></div>

  <div class="card">
    <h1>Космос в браузере</h1>
    <p>
      Двигай мышью · Кликай для взрыва · <kbd>Space</kbd> — режим:
      <span id="mode">отталкивание</span>
    </p>
  </div>

<script>
(() => {
  'use strict';

  const canvas    = document.getElementById('c');
  const ctx       = canvas.getContext('2d');
  const modeLabel = document.getElementById('mode');

  const LINK      = 120;    // дистанция связи между частицами
  const MAXV      = 2.6;    // максимальная скорость
  const R_POINTER = 190;    // радиус влияния курсора
  const MODES     = ['отталкивание', 'притяжение', 'вихрь'];

  let W = 0, H = 0, DPR = 1;
  let mode = 0;

  const pointer    = { x: -1e4, y: -1e4 };
  const particles  = [];

  const rand = (a, b) => a + Math.random() * (b - a);

  /* ── Частица ─────────────────────────────────────── */
  function makeParticle(x, y) {
    const ang = Math.random() * Math.PI * 2;
    const sp  = rand(0.1, 0.5);
    return {
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      r:   rand(1, 2.6),
      hue: rand(185, 330)          // циан → синий → фиолет → розовый
    };
  }

  /* ── Размеры ─────────────────────────────────────── */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const target = Math.round(Math.min(150, (W * H) / 11000));

    while (particles.length < target) {
      particles.push(makeParticle(Math.random() * W, Math.random() * H));
    }
    if (particles.length > target) particles.length = target;

    for (const p of particles) {
      p.x = Math.min(Math.max(p.x, 0), W);
      p.y = Math.min(Math.max(p.y, 0), H);
    }
  }

  /* ── Физика ──────────────────────────────────────── */
  function step(dt) {
    const fr = Math.pow(0.998, dt);          // лёгкое трение

    for (const p of particles) {

      /* влияние курсора */
      if (pointer.x > -1000) {
        const dx = p.x - pointer.x;
        const dy = p.y - pointer.y;
        const d2 = dx * dx + dy * dy;

        if (d2 < R_POINTER * R_POINTER && d2 > 0.5) {
          const d  = Math.sqrt(d2);
          const t  = 1 - d / R_POINTER;
          const f  = t * t * 1.15;
          const nx = dx / d;
          const ny = dy / d;

          if (mode === 0) {                 // отталкивание
            p.vx += nx * f;
            p.vy += ny * f;

          } else if (mode === 1) {          // притяжение
            p.vx -= nx * f * 0.85;
            p.vy -= ny * f * 0.85;
            if (d < 34) {                   // не даём слипнуться в точку
              const rep = (1 - d / 34) * 0.9;
              p.vx += nx * rep;
              p.vy += ny * rep;
            }

          } else {                          // вихрь
            p.vx += -ny * f * 1.7 - nx * f * 0.25;
            p.vy +=  nx * f * 1.7 - ny * f * 0.25;
          }
        }
      }

      /* жизнь не должна затухать */
      p.vx += (Math.random() - 0.5) * 0.02 * dt;
      p.vy += (Math.random() - 0.5) * 0.02 * dt;

      /* трение + ограничение скорости */
      p.vx *= fr;
      p.vy *= fr;

      const sp2 = p.vx * p.vx + p.vy * p.vy;
      if (sp2 > MAXV * MAXV) {
        const k = MAXV / Math.sqrt(sp2);
        p.vx *= k;
        p.vy *= k;
      }

      /* движение */
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      /* отражение от краёв */
      if (p.x < 0)      { p.x = 0; p.vx =  Math.abs(p.vx); }
      else if (p.x > W) { p.x = W; p.vx = -Math.abs(p.vx); }

      if (p.y < 0)      { p.y = 0; p.vy =  Math.abs(p.vy); }
      else if (p.y > H) { p.y = H; p.vy = -Math.abs(p.vy); }
    }
  }

  /* ── Отрисовка ───────────────────────────────────── */
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1;

    /* связи */
    const n = particles.length;
    for (let i = 0; i < n; i++) {
      const a = particles[i];
      for (let j = i + 1; j < n; j++) {
        const b  = particles[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > LINK * LINK) continue;

        const d = Math.sqrt(d2);
        const alpha = (1 - d / LINK) * 0.45;

        ctx.strokeStyle = `hsla(${(a.hue + b.hue) * 0.5}, 100%, 70%, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    /* частицы + ореол */
    for (const p of particles) {
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, 0.08)`;
      ctx.arc(p.x, p.y, p.r * 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 100%, 74%, 0.95)`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ── Взрыв по клику ──────────────────────────────── */
  function burst(x, y) {
    const R = 280;
    for (const p of particles) {
      const dx = p.x - x;
      const dy = p.y - y;
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < R) {
        const f = (1 - d / R) * 15;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
    }
  }

  /* ── Цикл ────────────────────────────────────────── */
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 16.667, 3);
    last = now;

    step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ── События ─────────────────────────────────────── */
  canvas.addEventListener('pointermove', e => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  });

  canvas.addEventListener('pointerdown', e => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    burst(e.clientX, e.clientY);
  });

  canvas.addEventListener('pointerleave', () => {
    pointer.x = pointer.y = -1e4;
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      mode = (mode + 1) % MODES.length;
      modeLabel.textContent = MODES[mode];
    }
  });

  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', () => {
    last = performance.now();   // чтобы не было «прыжка» после сворачивания
  });

  /* ── Старт ───────────────────────────────────────── */
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
