<html>
    <head>
        <title> Самостоятельное задание </title>
        <script>
            function showInfo() {
                var panel = document.getElementById('panel');
                panel.innerHTML = '<b>Заголовок документа:</b> ' + document.title + '<br>' + 
                '<b>Адрес документа:</b> ' + document.URL + '<br>' + 
                '<b>Последнее изменение:</b> ' + document.lastModified + '<br>' + 
                '<b>Источник перехода:</b> ' + document.referrer || '-' + '<br>' + 
                '<b>Число форм:</b> ' + document.forms.length + '<br>' + 
                '<b>Число изображений:</b> ' + document.images.length + '<br>' + 
                '<b>Число ссылок:</b> ' + document.links.length;
            }
        </script>
    </head>
    <body>
        <h1>Демонстрация свойств и методов document</h1>
        <div id="panel">Информация о документе появится здесь после загрузки.</div>

        <p>
            Полезная ссылка:
            <a href="https://learn.javascript.ru/">Современный учебник JavaScript</a>
        </p>
        <form>
            <input type="text" placeholder="Поле формы">
        </form>

        <img src="1.png" alt="картинка" style="height: 40px">

        <div>
            <button onclick="showInfo()">Показать информацию о документе</button>
            <button onclick="addParagraph()">Добавить абзац</button>
            <button onclick="countTag('p')">Сколько тегов?</button>
            <button onclick="countTag('button')">Сколько кнопок?</button>
            <button onclick="highlightFirstLink()">Выделить первую ссылку</button>
        </div>
    </body>
</html>
