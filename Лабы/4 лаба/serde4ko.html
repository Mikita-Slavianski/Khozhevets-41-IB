<html>
    <head>
        <title>Пульсирующее изображение</title>
        <script>
            var h = 200;
            var minH = 200;
            var maxH = 400;
            var step = 10;
            var dir = 1;
            var timer = null;
            var d = document;

            function pulse() {
                h = h + step * dir;
                d.images[0].height = h;

                if (h >= maxH) {
                    h = maxH;
                    dir = -1;
                } else if ( h <= minH) {
                    h = minH;
                    dir = 1;
                }

                timer = setTimeout(pulse, 100);
            }

            function startPulse() {
                if (timer === null) {
                    pulse();
                }
            }

            function stopPulse() {
                clearTimeout(timer);
                timer = null;
            }
        </script>
    </head>
    <body>
        <h4>При наведении курсора мыши на рисунок<br>изображение пульсирует: увеличивается и уменьшается</h4>
        <img src="1.png" name="mypict" height="200" onmouseover="startPulse()" onmouseout="stopPulse()">
    </body>
</html>
