<html>
    <head>
        <title>Самостоятельное задание</title>
        <style>
            body { font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f5f5f5; }
            .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px;}
            h3 {margin-top: 0; color: #333; }

            .notification-list { list-style: none; padding: 0; margin: 15px 0; }
            .notification-item {
                padding: 10px;
                margin-bottom: 8px;
                background-color: #e3f2fd;
                border-left: 5px sold #2196f3;
                border-radius: 4px;
                font-size: 14px;
                transition: all 0.3s ease;
            }


            .controls { display: flex; gap: 10px; margin-top: 15px; }
            button { padding: 8px 12px; border: none; border-radius: 4px; background-color: #6200ee; color: white; cursor: pointer; }
            button:hover { background-color: #3700b3; }
            .btn-toggle { background-color: #03dac6; color: #000; }
            .btn-toggle:hover { background-color: #018786; }
        </style>
    </head>
    <body>
        <div class="card">
            <h3 id="widgetTitle">Центр уведомлений</h3>

            <ul class="notification-list" id="listContainer">
                <li class="notification-item">Система запущена и работает стабильно.</li>
            </ul>

            <div class="controls">
                <button onclick="addNotification()">Добавить запись</button>
                <button onclick="resetWidget()" style="background-color: #757575">Сбросить</button>
            </div>
        </div>

        <script>
            const titile = document.querySelector('#widgetTitile');
            const container = document.querySelector('.notification-list');

            let counter = 1;

            function addNotification() {
                const newItem = document.createElement('li');
                newItem.classList.add('notification-item');
                newItem.innerHTML = `Новое уведомление <strong>№${counter}`;
                counter++;
                container.appendChild(newItem);
            }

            function resetWidget() {
                container.innerHTML = '<li class="notification-item">Система запущена и работает стабильно.</li>';

                title.innerHTML = "Центр уведомлений (сброшено)";

                counter = 1;
            }
        </script>
    </body>
</html>
