<html>
    <head>
        <title>2 задание</title>
    </head>
    <body>
        <script>
            function f1(element, color) {
                element.style.backgroundColor = color;
            }
        </script>
        <p onclick="f1(this, 'pink')">Кликни здесь, и этот абзац станет розовым.</p>
        <p onSelectStart="f1(this, 'lime')">Выдели этот текст, и его фон станет зелёным.</p>
    </body>
</html>
