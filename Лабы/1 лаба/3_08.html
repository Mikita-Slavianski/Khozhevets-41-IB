<html>
    <head>
        <title> Таймеры </title>
        <script>
            let ptime = setInterval("timer()", 1000);

            function timer() {
                ++document.all.time.innerText;
            }

            function stop() {
                clearInterval(ptime);
            }
        </script>
    </head>
    <body>
        <div id="time"> 0 </div>
        <input type="button" value="Stop" onclick="stop();">
    </body>
</html>
