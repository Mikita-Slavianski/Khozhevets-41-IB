<html>
    <head>
        <title> Задание 2 </title>
    </head>
    <body style="background-color:green">
        <p id="tp1" style="color:yellow; width: 8cm">Пример разбиения текста</p>
        <form>
            <input type="button" value="Первая" style="background-color: pink;" onclick="func1()">
            <input type="button" value="Вторая" style="background-color: lightblue;" onclick="func2()">
            <input type="button" value="Третья" style="background-color: lightgreen;" onclick="func3()">
        </form>

        <script>
            const originalText = document.getElementById("tp1").innerHTML;

            function func1() {
                document.getElementById("tp1").style.backgroundColor = "pink";
                document.getElementById("tp1").style.color = "blue";
                document.getElementById("tp1").innerHTML = originalText;
            }

            function func2() {
                document.getElementById("tp1").style.backgroundColor = "lightblue";
                document.getElementById("tp1").style.color = "blue";
                const words = originalText.split(' ');
                const middle = Math.ceil(words.length / 2);
                const line1 = words.slice(0, middle).join(' ');
                const line2 = words.slice(middle).join(' ');
                document.getElementById("tp1").innerHTML = line1 + '<br>' + line2;
            }

            function func3() {
                document.getElementById("tp1").style.backgroundColor = "lightgreen";
                document.getElementById("tp1").style.color = "blue";
                const words = originalText.split(' ');
                const part1 = Math.ceil(words.length / 3);
                const part2 = Math.ceil((words.length * 2) / 3);

                const line1 = words.slice(0, part1).join(' ');
                const line2 = words.slice(part1, part2).join(' ');
                const line3 = words.slice(part2).join(' ');
                document.getElementById("tp1").innerHTML = line1 + '<br>' + line2 + '<br>' + line3;
            }
        </script>
    </body>
</html>
