<html>
    <head>
        <title> Задание 3 </title>
        <style>
            p {
                border: 2px solid #333;
                padding: 10px;
                margin: 10px 0;
                width: 300px;
                background-color: #f0f0f0;
                cursor: pointer;
                user-select: none;
            }

            p:hover {
                background-color: #e0e0e0;
            }
        </style>
    </head>
    <body>
        <p id="p1" onclick="swapTexts()">Это текст первого абзаца. Нажми на меня!</p>
        <p id="p2" onclick="swapTexts()">А это текст второго абзаца. И на меня тоже!</p>

        <script>
            function swapTexts() {
                const p1 = document.getElementById("p1");
                const p2 = document.getElementById("p2");
                const tempText = p1.innerHTML;
                p1.innerHTML = p2.innerHTML;
                p2.innerHTML = tempText;
            }
        </script>
    </body>
</html>
