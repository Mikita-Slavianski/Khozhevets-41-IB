<html>
    <head>
        <title> Пример 42 </title>
        <script>
            function func1() {
                document.getElementById("tp1").style.backgroundColor = "pink";
                document.getElementById("tp1").value = "";
            }

            function func2() {
                document.getElementById("tp1").style.color = "lightblue";
                var text = document.getElementById("tp1").value;
                var name = text.split("=")[0];
                var value = text.split("=")[1];
                localStorage.setItem(name, value);
                document.getElementById("tp1").value = "";
                
            }

            function func3() {
                name = document.getElementById("tp1").value;
                document.getElementById("tp1").style.color = "lightgreen";
                document.getElementById("tp1").value = name + '=' + localStorage.getItem(name);
            }
        </script>
    </head>
    <body style="background-color:green">
        <p style="color:yellow">Пример использования формы с кнопками</p>
        <form>
            <input id="tp1" type="text" size=80 value="">
            <br>
            <input type="button" value="Очистить" style="background-color: pink;" onclick="func1()">
            <input type="button" value="Запомнить" style="background-color: lightblue;" onclick="func2()">
            <input type="button" value="Вывести" style="background-color: lightgreen;" onclick="func3()">
        </form>
    </body>
</html>
