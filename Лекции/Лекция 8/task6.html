<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 40px;
            margin: 0;
        }
        #calendar {
            width: 320px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #222;
        }
        table { 
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: center;
            padding: 6px 0;
            font-size: 14px;
        }
        th {
            color: #555;
            font-weight: 600;
        }
        td {
            border-radius: 4px;
        }
        .today {
            background: #ffcc00;
            font-weight: bold;
            color: #000;
        }
        .other {
            color: #bbb;
        }
    </style>
</head>
<body>
    <div id="calendar">
        <div id="title"></div>
        <table>
            <thead>
                <tr>
                    <th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th>
                </tr>
            </thead>
            <tbody id="days"></tbody>
        </table>
    </div>

    <script>
        const months = [
            "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
        ];

        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        document.getElementById("title").textContent = months[month] + " " + year;

        const firstDay = new Date(year, month, 1);
        let startShift = firstDay.getDay() - 1;
        if (startShift < 0) startShift = 6;

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        
        const tbody = document.getElementById("days");
        let row = document.createElement("tr");

        for (let i = startShift; i > 0; i--) {
            const td = document.createElement("td");
            td.className = "other";
            td.textConent = daysInPrevMonth - i + 1;
            row.appendChild(td);
        }

        for (let d = 1; d <= daysInMonth; d++) {
            if (row.children.length === 7) {
                tbody.appendChild(row);
                row = document.createElement("tr");
            }
            const td = document.createElement("td");
            td.textContent = d;
            if (d === today) td.className = "today";
            row.appendChild(td);
        }

        while (row.children.length < 7) {
            const td = document.createElement("td");
            row.appendChild(td);
        }
        tbody.appendChild(row);
    </script>
</body>
</html>
