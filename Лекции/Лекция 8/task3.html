<html>
    <head>
        <title> Задание 3 </title>
    </head>
    <body style="background-color:green" onload="setInterval('clock()', 500)">
        <div id="cl" style="font-size: 28px; font-family: Arial; background: white; height: 30px; width: 200px; border: 7px double black; text-align: center;">23:45:00</div>
        <script>
            var dd = ":";

            function clock() {
                var data = new Date();
                var h = data.getHours();
                var min = data.getMinutes();
                var sec = data.getSeconds();

                if (parseInt(h)<10) h = "0" + h;
                if (parseInt(min)<10) min = "0" + min;
                if (parseInt(sec)<10) sec = "0" + sec;
                document.getElementById("cl").innerHTML = h + dd + min + dd + sec;

                if(dd==":") dd = " ";
                else dd=":";
            }
        </script>
    </body>
</html>
