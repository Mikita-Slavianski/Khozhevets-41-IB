<html>
    <head>
        <title> Задание 1 </title>
        <script>
            function func1() {
                alert(document.title)
            }

            function func2() {
                alert(document.URL)
            }

            function func3() {
                document.writeln("navigator.appName:" + navigator.appName + "<BR>" +
                                 "navigator.appVersion:" + navigator.appVersion + "<BR>" +
                                 "navigator.userAgent:" + navigator.userAgent + "<BR>" +
                                 "navigator.platform:" + navigator.platform + "<BR>" +
                                "navigator.language:" + navigator.language + "<BR>" +
                                "navigator.cookieEnabled:" + navigator.cookieEnabled)
            }
        </script>
    </head>
    <body style="background-color:green">
        <p style="color:yellow">Пример использования формы с кнопками</p>
        <form>
            <input type="button" value="Первая" onclick="func1()">
            <input type="button" value="Вторая" onclick="func2()">
            <input type="button" value="Третья" onclick="func3()">
        </form>
    </body>
</html>
