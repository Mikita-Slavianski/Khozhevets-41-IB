<html>
    <head>
        <title> Задание 4 </title>
        <script>
            let previousButton = null;

            function setField(color, message, button) {
                if (previousButton && previousButton !== button) {
                    previousButton.value = previousButton.dataset.original;
                }

                if (!button.dataset.original) {
                    button.dataset.original = button.value;
                }

                button.value = "Нажата";
                previousButton = button;

                document.getElementById("tp1").style.backgroundColor = color;
                document.getElementById("tp1").value = message;
                document.getElementById("tp1").style.textAlign = "center";
                document.getElementById("tp1").size = message.length;
            }
        </script>
    </head>
    <body style="background-color:green">
        <p style="color:yellow">Пример использования формы с кнопками</p>
        <form>
            <input id="tp1" type="text" size=32 value="">
            <br>
            <input type="button" value="Первая" style="background-color: pink;" onclick="setField('pink', 'Вы нажали первую кнопку', this)">
            <input type="button" value="Вторая" style="background-color: lightblue;" onclick="setField('lightblue', 'Вы нажали вторую кнопку', this)">
            <input type="button" value="Третья" style="background-color: lightgreen;" onclick="setField('lightgreen', 'Вы нажали третью кнопку', this)">
        </form>
    </body>
</html>
