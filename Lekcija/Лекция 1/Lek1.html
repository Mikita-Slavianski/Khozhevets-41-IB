<!DOCTYPE html>
<html>
<head>
    <title>Объекты JS</title>
</head>
<body>
    <h1>Работа с window, document, location, history, navigator, global</h1>
    <div id="demo">Этот текст будет изменён.</div>
    <button onclick="demoWindow()">window</button>
    <button onclick="demoDocument()">document</button>
    <button onclick="demoLocation()">location</button>
    <button onclick="demoHistory()">history</button>
    <button onclick="demoNavigator()">navigator</button>
    <button onclick="demoGlobal()">global</button>

    <script>
        function demoWindow() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            alert(`Ширина окна: ${width}px, высота: ${height}px`);
        }


        function demoDocument() {
            console.log('Текущий заголовок:', document.title);

            const elem = document.getElementById('demo');
            if (elem) {
                elem.innerHTML = 'Текст изменён через JavaScript!';
            } else {
                console.warn('Элемент с id="demo" не найден.');
            }

            console.log('URL страницы:', document.URL);
        }


        function demoLocation() {
            console.log('Текущий URL:', location.href);
            console.log('Путь:', location.pathname);

            if (confirm('Перезагрузить страницу?')) {
                location.reload();
            }
        }


        function demoHistory() {
            console.log('Длина истории:', history.length);

            if (confirm('Вернуться на предыдущую страницу?')) {
                history.back();
            }
        }


        function demoNavigator() {
            console.log('User-Agent:', navigator.userAgent);
            console.log('Язык:', navigator.language);
            console.log('Cookie включены?', navigator.cookieEnabled);
            console.log('Java включена?', navigator.javaEnabled());
        }


        function demoGlobal() {
            globalThis.myGlobalVar = 'Это глобальная переменная';

            console.log('globalThis.myGlobalVar =', globalThis.myGlobalVar);
            if (typeof window !== 'undefined') {
                console.log('window.myGlobalVar =', window.myGlobalVar);
            }

            console.log('globalThis === window?', globalThis === window);
        }
    </script>
</body>
</html>
