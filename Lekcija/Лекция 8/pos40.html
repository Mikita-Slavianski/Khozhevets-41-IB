<html>
    <head>
        <title> Пример 40 </title>
        <script>
            function clock() {
                var data = new Date();
                var sec = data.getSeconds();
                var min = data.getMinutes();
                var h = data.getHours() % 12;

                for (i=1;i<61;i++) {
                    document.getElementById("secs"+i).style.top = Yc + 1 - (i-1)*Math.cos(K*sec);
                    document.getElementById("secs"+i).style.left = Xc + 1 + (i-1)*Math.sin(K*sec);
                    document.getElementById("mins"+i).style.top = Yc - (i-1)*Math.cos(K*min);
                    document.getElementById("mins"+i).style.left = Xc + (i-1)*Math.sin(K*min);
                    if (i < 36) {
                        document.getElementById("hrs"+i).style.top = Yc - (i-1)*Math.cos(5*K*h + K*min/12);
                        document.getElementById("hrs"+i).style.left = Xc + (i-1)*Math.sin(5*K*h + K*min/12);
                    }
                }
            }
        </script>
    </head>
    <body style="background-color:lightgreen" onload="clock(); setInterval(clock, 500)">
        <script>
            for(i=1;i<13;i++) {
                document.write('<div id="digs'+i+'" style="position:absolute; width:19px; font-family: Arial Black; font-size: 14px; color:blue; text-align:center;">'+i+'</div>');
            }

            for(i=1;i<36;i++) {
                document.write('<img id="hrs'+i+'" src="darkblue.jpg" style="position: absolute; width: 3px; height:3px;">');
            }

            for(i=1;i<61;i++) {
                document.write('<img id="mins'+i+'" src="darkblue.jpg" style="position:absolute; width:3px; height:3px;">');
            }

            for(i=1;i<61;i++) {
                document.write('<img id="secs'+i+'" src="red.jpg" style="position:absolute; width:3px; height:3px;">');
            }

            var Xc=500;
            var Yc=400;
            var K = Math.PI/30;

            for (i=1; i<13; i++) {
                document.getElementById("digs" + i).style.top = Yc - 8 - 60 * Math.cos(5*K*i);
                document.getElementById("digs"+i).style.left = Xc - 8 + 60 * Math.sin(5*K*i);
            }
        </script>

    </body>
</html>
