<html>
    <head>
        <title> Задание 1 </title>
        <script>
            function func1() {
                document.getElementById("tp1").style.backgroundColor = "hsl(350, 100%, 40%)";
                document.getElementById("tp1").innerHTML = "Вы нажали первую кнопку";
                document.getElementById("tp1").style.color = "hsl(240, 100%, 40%)";
            }

            function func2() {
                document.getElementById("tp1").style.backgroundColor = "hsl(200, 50%, 85%)";
                document.getElementById("tp1").innerHTML = "Вы нажали вторую кнопку";
                document.getElementById("tp1").style.color = "hsl(240, 50%, 40%)";
            }

            function func3() {
                document.getElementById("tp1").style.backgroundColor = "hsl(120, 20%, 85%)";
                document.getElementById("tp1").innerHTML = "Вы нажали третью кнопку";
                document.getElementById("tp1").style.color = "hsl(240, 20%, 40%)";
            }
        </script>
    </head>
    <body style="background-color:green">
        <p id="tp1" style="color:yellow; width: 8cm">Пример использования формы с кнопками</p>
        <form>
            <input type="button" value="Первая" style="background-color: pink;" onclick="func1()">
            <input type="button" value="Вторая" style="background-color: lightblue;" onclick="func2()">
            <input type="button" value="Третья" style="background-color: lightgreen;" onclick="func3()">
        </form>
    </body>
</html>
