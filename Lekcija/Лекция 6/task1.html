<html>
    <head>
        <title> Задание 1 </title>
        <script>
            function func1() {
                document.getElementById("rr1").src = "pic1.jpg";
                document.getElementById("abz").textContent = "Картинка 1";
            }

            function func2() {
                document.getElementById("rr1").src = "pic2.jpg";
                document.getElementById("abz").textContent = "Картинка 2";
            }
        </script>
    </head>
    <body style="background-color:blue">
        <img id="rr1" src="pic1.jpg" style="height:150px">
        <p id="abz" style="color:yellow">Картинка 1</p>
        <form>
            <input type="button" value="Первая" onclick="func1()">
            <input type="button" value="Вторая" onclick="func2()">
        </form>
    </body>
</html>
