<html>
    <head>
        <title> Задание 6 </title>
        <script>
            var n = 0;
            var NN = ["150px", "180px", "210px", "240px", "270px", "300px"];

            function func2() {
                if (n < NN.length - 1) {
                    n++;
                    document.getElementById("rr1").style.height = NN[n];

                    if (n === NN.length - 1) {
                        document.getElementById("rr1").onclick = null;
                    }
                }
            }
        </script>
    </head>
    <body style="background-color:blue">
        <img id="rr1" src="pic1.jpg" style="height:150px" onclick="func2()">
        <p style="color:yellow"></p>
    </body>
</html>
