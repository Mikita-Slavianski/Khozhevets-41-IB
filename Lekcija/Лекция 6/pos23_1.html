<html>
    <head>
        <title> Пример 23.1 </title>
        <script>
            var flag = true;

            function func2() {
                flag =! flag;
                if (flag) document.getElementById("rr1").src="pic2.jpg";
                else document.getElementById("rr1").src = "pic1.jpg";
            }
        </script>
    </head>
    <body style="background-color:blue">
        <img id="rr1" src="pic1.jpg" style="height:150px" onclick="func2()">
        <p style="color:yellow"></p>
    </body>
</html>
