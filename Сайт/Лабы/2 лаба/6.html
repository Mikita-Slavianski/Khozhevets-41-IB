<html>
    <head>
        <title> Задание 6 </title>
        <script>
        function calculateSum() {
            var num1 = parseFloat(document.getElementById('num1').value) || 0;
            var num2 = parseFloat(document.forms[0].elements[1].value) || 0;

            var sum = num1 + num2;

            document.getElementById("sum").value = sum;
        }
    </script>
    </head>
    <body>
        <form>
            Первое число <input id="num1" type="text"><br>
            Второе число <input type="text"><br>
            <input type="button" value="Вычислить сумму" onclick="calculateSum();"><br>
            <br><br>
            Сумма <input id="sum" type="text">
        </form>
    </body>
</html>
