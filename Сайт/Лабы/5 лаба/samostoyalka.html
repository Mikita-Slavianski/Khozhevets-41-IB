<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Самостоялка</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #box {
      width: 200px; height: 100px;
      background: lightblue;
      display: flex; align-items: center; justify-content: center;
      margin: 10px 0; cursor: pointer;
    }
    #log { white-space: pre-line; color: #333; }
    a { display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>

  <h3>Свойства и методы объекта event</h3>

  <div id="box">Кликни по мне</div>

  <input id="name" type="text" placeholder="Введи текст">
  <a id="link" href="https://example.com">Ссылка (по умолчанию откроет example.com)</a>

  <p id="log">Лог событий:</p>

  <script>
    const log = (msg) => {
      document.getElementById('log').textContent += '\n' + msg;
    };

    const box = document.getElementById('box');

    box.addEventListener('click', (event) => {
      log(`--- click ---`);
      log(`type: ${event.type}`);
      log(`target: #${event.target.id}`);
      log(`currentTarget: #${event.currentTarget.id}`);
      log(`clientX/Y: ${event.clientX}, ${event.clientY}`);
      log(`button: ${event.button} (0 — левая)`);
      log(`timeStamp: ${event.timeStamp.toFixed(0)} ms`);

      box.style.background = 'lightgreen';
    });

    document.getElementById('link').addEventListener('click', (event) => {
      event.preventDefault();
      log(`--- click на ссылке ---`);
      log(`preventDefault() вызван → переход отменён`);
    });

    document.getElementById('name').addEventListener('keydown', (event) => {
      log(`--- keydown ---`);
      log(`key: ${event.key}, code: ${event.code}`);
      log(`ctrlKey: ${event.ctrlKey}, shiftKey: ${event.shiftKey}`);
    });

    document.body.addEventListener('click', (event) => {
      log(`[body capture] target = #${event.target.id}, phase = ${event.eventPhase}`);
    }, true);

    document.body.addEventListener('click', (event) => {
      log(`[body bubble] phase = ${event.eventPhase}`);
    });

    box.addEventListener('mouseover', (event) => {
      log(`--- mouseover --- relatedTarget: ${event.relatedTarget?.tagName || 'null'}`);
    });

    window.addEventListener('scroll', (event) => {
      log(`--- scroll --- target: ${event.target === document ? 'document' : event.target}`);
    });
  </script>

</body>
</html>
