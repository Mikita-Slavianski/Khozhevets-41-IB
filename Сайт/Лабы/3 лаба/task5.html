<html>
    <head>
        <title>Управление innerHTML</title>
    </head>
    <body>
        <div id="myElement" class="box">
            Привет! Это <strong>изначальный</strong> текст внутри блока.
        </div>

        <button onclick="readContent()">Прочитать содержимое</button>
        <button onclick="setContent()">Установить новое содержимое</button>
        <button onclick="clearContent()">Очистить элемент</button>

        <script>
            const element = document.getElementById('myElement');

            function readContent() {
                const currentHTML = element.innerHTML;
                alert("Текущее содержимое innerHTML:\n" + currentHTML);
            }

            function setContent() {
                element.innerHTML = "Привет! Я <em>новое</em> содержимое с <span style='color: red;'>красным текстом</span>.";
            }

            function clearContent() {
                element.innerHTML = "";
            }
        </script>
    </body>
</html>
