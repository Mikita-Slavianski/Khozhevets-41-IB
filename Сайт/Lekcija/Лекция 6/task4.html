<html>
    <head>
        <title> Задание 4 </title>
        <script>
            var n = 0;
            var pic = ["pic1.jpg", "pic2.jpg", "pic3.jpg"];

            function update() {
                document.getElementById("rr1").src = pic[n];

                document.getElementById("btnLeft").disabled = (n === 0);
                document.getElementById("btnRight").disabled = (n === pic.length - 1);
            }

            function nextPic() {
                if (n < pic.length - 1) {
                    n++;
                    update();
                }
            }

            function prevPic() {
                if (n > 0) {
                    n--;
                    update();
                }
            }

            window.onload = update;
        </script>
    </head>
    <body style="background-color:blue">
        <img id="rr1" src="pic1.jpg" style="height:150px">
        <div>
            <button id="btnLeft" type="button" onclick="prevPic()" disabled>Назад</button>
            <button id="btnRight" type="button" onclick="nextPic()">Вперёд</button>
        </div>
    </body>
</html>
