<html>
    <head>
        <title> Задание 9 </title>
        <script>
            var n = 0;
            var pic = ["pic1.jpg", "pic2.jpg", "pic3.jpg"];

            var m = 0;
            var NN = ["150px", "180px", "210px", "240px", "270px", "300px"];

            function update() {
                document.getElementById("rr1").src = pic[n];

                document.getElementById("rr1").style.height = NN[m];

                document.getElementById("btnPrev").disabled = (n === 0);
                document.getElementById("btnNext").disabled = (n === pic.length - 1);

                document.getElementById("btnInc").disabled = (m === NN.length - 1);
                document.getElementById("btnDec").disabled = (m === 0);
            }

            function prevPic() {
                if (n > 0) {
                    n--;
                    update();
                }
            }

            function nextPic() {
                if (n < pic.length - 1) {
                    n++;
                    update();
                }
            }

            function increase() {
                if (m < NN.length - 1) {
                    m++;
                    update();
                }
            }

            function decrease() {
                if (m > 0) {
                    m--;
                    update();
                }
            }

            window.onload = update;
        </script>
    </head>
    <body style="background-color:blue">
        <img id="rr1" src="pic1.jpg" style="height:150px">

        <div>
            <button id="btnPrev" type="button" onclick="prevPic()" disabled>Назад</button>
            <button id="btnNext" type="button" onclick="nextPic()">Вперёд</button>
            <button id="btnInc" type="button" onclick="increase()">Увеличить</button>
            <button id="btnDec" type="button" onclick="decrease()" disabled>Уменьшить</button>
        </div>

        <p style="color:yellow"></p>
    </body>
</html>
