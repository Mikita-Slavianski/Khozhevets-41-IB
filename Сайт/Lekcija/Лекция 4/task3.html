<html>
    <head>
        <title> Задание 3 </title>
        <script>
            function setField(color, message) {
                document.getElementById("tp1").style.backgroundColor = color;
                document.getElementById("tp1").value = message;
                document.getElementById("tp1").style.textAlign = "center";
                document.getElementById("tp1").size = message.length;
            }
        </script>
    </head>
    <body style="background-color:green">
        <p style="color:yellow">Пример использования формы с кнопками</p>
        <form>
            <input id="tp1" type="text" size=32 value="">
            <br>
            <input type="button" value="Первая" style="background-color: pink;" onclick="setField('pink', 'Вы нажали первую кнопку')">
            <input type="button" value="Вторая" style="background-color: lightblue;" onclick="setField('lightblue', 'Вы нажали вторую кнопку')">
            <input type="button" value="Третья" style="background-color: lightgreen;" onclick="setField('lightgreen', 'Вы нажали третью кнопку')">
        </form>
    </body>
</html>
